server:
  port: 8080
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meetingroom}
    username: ${SPRING_DATASOURCE_USERNAME:meetingroom}
    password: ${SPRING_DATASOURCE_PASSWORD:localdevpassword}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
