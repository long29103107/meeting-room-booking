services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetingroom}
      POSTGRES_USER: ${POSTGRES_USER:-meetingroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-meetingroom}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-meetingroom}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-localdevpassword}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5001"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5000:80"
volumes:
  dbdata:
